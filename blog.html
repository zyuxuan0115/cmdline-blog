<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400;1,700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="blog.css?v=6">
</head>
<body>
  <div class="page">
    <a class="back-link" href="index.html">&larr; terminal</a>
    <header class="site-header">
      <h1 id="blog-author">&nbsp;</h1>
      <div class="site-subline">
        <p id="blog-sub" class="site-sub"></p>
        <form id="blog-search" class="site-search" role="search" hidden>
          <button type="button" id="blog-search-toggle" class="search-toggle"
                  aria-label="Search these posts" aria-expanded="false">
            <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
              <circle cx="8.5" cy="8.5" r="5.5"></circle>
              <line x1="12.6" y1="12.6" x2="17.5" y2="17.5"></line>
            </svg>
          </button>
          <input type="search" id="blog-search-input" class="search-field" name="q"
                 autocomplete="off" placeholder="Search these posts" aria-label="Search these posts">
        </form>
      </div>
    </header>

    <main id="blog-main">
      <p class="status">Loading…</p>
    </main>

    <footer class="site-footer">
      <a href="/apps/cmdline-blog/">CmdLine Blog</a>
      <span class="sep" aria-hidden="true">·</span>
      <a href="https://github.com/zyuxuan0115/cmdline-blog" target="_blank" rel="noopener">Source Code</a>
    </footer>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/blog.js"></script>
</body>
</html>
