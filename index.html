<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Document Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
  <!-- CodeMirror + its vim keymap power the document editors. Loaded before
       style.css so the pixel theme can override CodeMirror's defaults. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/dialog/dialog.css">
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/dialog/dialog.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/search/searchcursor.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/matchbrackets.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/keymap/vim.js"></script>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <div id="desktop">
    <canvas id="space-bg"></canvas>
    <div id="main-area">
      <div id="windows-container"></div>
    </div>
    <div id="terminal-panel">
      <div id="terminal-resize-handle"></div>
      <img id="terminal-girl" src="pic/girl.png" alt="">
      <div id="terminal-girl-bubble">Welcome to CmdLine Blog</div>

      <div id="terminal-output"></div>
      <div id="terminal-input-row">
        <span id="terminal-prompt">$ </span>
        <input id="terminal-input" type="text" autocomplete="off" spellcheck="false" autofocus>
      </div>
    </div>
    <div id="help-sidebar">
      <div id="help-sidebar-drag-handle"></div>
      <div id="help-sidebar-header">
        <span id="help-sidebar-title">Commands</span>
        <button id="help-sidebar-close" title="Close (help close)">✕</button>
      </div>
      <div id="help-sidebar-content"></div>
    </div>
    <img id="sidebar-girl" src="pic/blonde_girl.png" alt="">
  </div>
  <script src="js/firebase-config.js?v=7"></script>
  <script src="js/state.js?v=7"></script>
  <script src="js/db.js?v=7"></script>
  <script src="js/helpers.js?v=7"></script>
  <script src="js/auth.js?v=7"></script>
  <script src="js/help.js?v=7"></script>
  <script src="js/vim-editor.js?v=7"></script>
  <script src="js/documents.js?v=7"></script>
  <script src="js/messages.js?v=7"></script>
  <script src="js/terminal.js?v=7"></script>
  <script src="js/resize.js?v=7"></script>
  <script src="js/background.js?v=7"></script>
  <script src="js/init.js?v=7"></script>
</body>
</html>
